version: '3.8'

services:
  app:
    build: .
    container_name: petrocalc_app
    restart: always
    ports:
      - "8501:8501"
    environment:
      - DB_HOST=postgres
      - DB_NAME=petrocalc
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: petrocalc_postgres
    restart: always
    environment:
      POSTGRES_DB: petrocalc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  caddy:
    image: caddy:2.7-alpine
    container_name: petrocalc_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
